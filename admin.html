<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff41;
            --bg: #0a0a0b;
            --surface: #151517;
            --danger: #ff3e3e;
            --border: #333;
            --text-dim: #666;
        }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-transform: uppercase;
            padding: 20px;
        }

        .container {
            background: var(--surface);
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            width: 100%;
            max-width: 500px;
            margin-bottom: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 0.8rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }

        button:hover {
            background: var(--primary);
            color: #000;
        }

        button.danger {
            border-color: var(--danger);
            color: var(--danger);
            margin-top: 2rem;
        }

        button.danger:hover {
            background: var(--danger);
            color: #000;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 1rem;
            border-top: 1px dashed var(--border);
            padding-top: 1rem;
        }

        .tel-item {
            font-size: 0.9rem;
            background: #000;
            padding: 5px 10px;
            border: 1px solid #222;
        }

        .tel-label {
            color: var(--text-dim);
            font-size: 0.7rem;
            display: block;
        }

        #login-screen {
            display: block;
        }

        #admin-panel {
            display: none;
        }

        .status-msg {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            height: 1rem;
        }

        .info-box {
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.2);
            padding: 10px;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="container">
        <h1>CONTROL DE ACCESO</h1>
        <div class="form-group">
            <label>INGRESAR CONTRASEÑA ADMIN</label>
            <input type="password" id="pass-input">
        </div>
        <button onclick="checkPass()">ACCEDER A COMANDOS</button>
        <div id="login-msg" class="status-msg"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-panel" class="container">
        <h1>COMANDO DE MISIÓN</h1>

        <div class="info-box">
            GESTIONANDO MISIÓN: <span id="current-id-display" style="color:#fff">NINGUNA</span>
            <br>
            <span style="font-size: 0.7rem; color: var(--text-dim);">CLIENTE: </span>
            <span id="tel-client" style="color:var(--primary); font-size: 0.7rem;">-</span>
        </div>

        <div class="form-group">
            <label>ID DE MISIÓN OBJETIVO</label>
            <input type="text" id="mission-id-input" placeholder="HS-001">
            <button onclick="switchMission()">CAMBIAR CANAL</button>
        </div>

        <div style="border: 1px solid #333; padding: 15px; margin-bottom: 20px;">
            <div class="form-group" style="margin-bottom: 5px;">
                <label>NOMBRE DE LA MISIÓN (DASHBOARD)</label>
                <input type="text" id="mission-name-input" placeholder="ZHUQUE-3 VUELO X">
            </div>
            <button onclick="updateMissionName()">ACTUALIZAR IDENTIDAD</button>
        </div>

        <div id="telemetry-monitor">
            <div style="text-align: center; font-size: 0.7rem; color: var(--text-dim); margin-bottom: 5px;">MONITOR DE
                TELEMETRÍA EN VIVO</div>
            <div class="telemetry-grid">
                <div class="tel-item">
                    <span class="tel-label">RELOJ</span>
                    <span id="tel-met">T- 00:00:00</span>
                </div>
                <div class="tel-item">
                    <span class="tel-label">ESTADO</span>
                    <span id="tel-status">OFFLINE</span>
                </div>
                <div class="tel-item">
                    <span class="tel-label">ALTITUD</span>
                    <span id="tel-alt">0</span> M
                </div>
                <div class="tel-item">
                    <span class="tel-label">VELOCIDAD</span>
                    <span id="tel-vel">0</span> M/S
                </div>
            </div>
        </div>

        <button class="danger" onclick="resetAllData()">PURGAR DATOS DE ESTA MISIÓN</button>

        <div id="admin-msg" class="status-msg"></div>
        <div style="margin-top: 2rem; text-align: center;">
            <a href="index.html" id="dash-link"
                style="color: var(--primary); text-decoration: none; font-size: 0.7rem;">← VOLVER AL DASHBOARD</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAiZs5Edhj2M0GIroo7thpD-fz6UOWpoZQ",
            authDomain: "control-de-mision-js.firebaseapp.com",
            projectId: "control-de-mision-js",
            storageBucket: "control-de-mision-js.firebasestorage.app",
            messagingSenderId: "771859762827",
            appId: "1:771859762827:web:00caa47bca9e3aad5b4e8e",
            measurementId: "G-WY3SGSG5YM",
            databaseURL: "https://control-de-mision-js-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ADMIN_PASS = "Kion2011";
        let currentMissionID = "HS-DEFAULT";
        let telemetryUnsub = null;
        let globalUnsub = null;

        window.checkPass = function () {
            const val = document.getElementById('pass-input').value;
            if (val === ADMIN_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                switchMission(); // Cargar por defecto
            } else {
                showMsg("CLAVE DE ACCESO INVÁLIDA", "login-msg");
            }
        };

        window.switchMission = function () {
            const newID = document.getElementById('mission-id-input').value.trim().toUpperCase();
            if (newID) currentMissionID = newID;

            document.getElementById('current-id-display').innerText = currentMissionID;
            document.getElementById('dash-link').href = `index.html?id=${currentMissionID}`;

            // Limpiar listeners viejos
            if (telemetryUnsub) telemetryUnsub();
            if (globalUnsub) globalUnsub();

            setupListeners();
            showMsg("CAMBIADO A " + currentMissionID, "admin-msg");
        };

        function setupListeners() {
            // MET, Nombre e Info del Cliente
            const globalRef = ref(db, `missions/${currentMissionID}/global`);
            globalUnsub = onValue(globalRef, (snap) => {
                const data = snap.val();
                if (data) {
                    document.getElementById('mission-name-input').value = data.mission_name || "";
                    document.getElementById('tel-client').innerText = data.client_name || "SIN IDENTIFICAR";
                    updateClock(data.mission_start);
                } else {
                    document.getElementById('tel-met').innerText = "T- 00:00:00";
                    document.getElementById('tel-client').innerText = "-";
                }
            });

            // Active Telemetry (Prefer Ship, then Booster)
            const shipRef = ref(db, `missions/${currentMissionID}/ship`);
            telemetryUnsub = onValue(shipRef, (snap) => {
                const data = snap.val();
                if (data) updateMonitor(data);
                else {
                    // Try Booster fallback
                    const boosterRef = ref(db, `missions/${currentMissionID}/booster`);
                    onValue(boosterRef, (bSnap) => {
                        const bData = bSnap.val();
                        if (bData) updateMonitor(bData);
                    }, { onlyOnce: true });
                }
            });
        }

        function updateMonitor(data) {
            // kOS Lexicon parsing simple fallback
            let clean = data;
            if (data.entries) {
                clean = {};
                for (let i = 0; i < data.entries.length - 1; i += 2) {
                    clean[data.entries[i].value] = data.entries[i + 1].value;
                }
            }
            document.getElementById('tel-status').innerText = clean.status || clean.STATUS || "OFFLINE";
            document.getElementById('tel-alt').innerText = Math.round(clean.alt || clean.ALT || 0).toLocaleString();
            document.getElementById('tel-vel').innerText = Math.round(clean.vel || clean.VEL || 0).toLocaleString();
        }

        function updateClock(start) {
            if (!start) {
                document.getElementById('tel-met').innerText = "T- 00:00:00";
                return;
            }
            const diff = (Date.now() / 1000) - start;
            if (diff < 0) {
                document.getElementById('tel-met').innerText = "T- 00:00:00";
                return;
            }
            const hrs = Math.floor(diff / 3600);
            const mins = Math.floor((diff % 3600) / 60);
            const secs = Math.floor(diff % 60);
            document.getElementById('tel-met').innerText = "T+ " +
                String(hrs).padStart(2, '0') + ":" +
                String(mins).padStart(2, '0') + ":" +
                String(secs).padStart(2, '0');
        }

        window.updateMissionName = function () {
            const name = document.getElementById('mission-name-input').value;
            if (!name) return;
            set(ref(db, `missions/${currentMissionID}/global/mission_name`), name)
                .then(() => showMsg("IDENTIDAD ACTUALIZADA", "admin-msg"));
        };

        window.resetAllData = function () {
            if (confirm(`CRÍTICO: ¿PURGAR TODOS LOS DATOS DE LA MISIÓN ${currentMissionID}?`)) {
                remove(ref(db, `missions/${currentMissionID}`))
                    .then(() => showMsg("DATOS DE MISIÓN PURGADOS", "admin-msg"));
            }
        };

        function showMsg(txt, id) {
            const el = document.getElementById(id);
            el.innerText = txt;
            setTimeout(() => { el.innerText = ""; }, 3000);
        }

        // Live clock update for monitor
        setInterval(() => {
            const val = document.getElementById('current-id-display').innerText;
            if (val !== "NONE") {
                // The global listener handles the logic, but we need the tick if the listener only fires on data change
                // (We could fetch start once and tick locally for better performance)
            }
        }, 1000);
    </script>
</body>

</html>
</body>

</html>
